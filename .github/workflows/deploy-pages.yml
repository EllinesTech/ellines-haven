# Auto-deploy Ellines Haven frontend to Cloudflare Pages on push to main.
# Mirrors Ellines Tech Website (deploy-pages.yml). Firebase rules/functions
# stay in deploy.yml — this workflow only builds + uploads `dist/`.
#
# Required GitHub Actions secrets:
#   CLOUDFLARE_API_TOKEN   Account API token with Pages Edit
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare account id
#
# Optional: attach Git in the dashboard instead, then disable this workflow
# to avoid double deploys.
#   dash.cloudflare.com → Workers & Pages → ellines-haven → Settings → Builds
#   → Connect to Git → branch main, build `npm run build`, output `dist`
#
# Zone cache tip (custom domain haven.ellines.co.ke):
#   Caching → Configuration → Browser Cache TTL = "Respect Existing Headers"
#   Avoid zone Cache Rules that set long TTLs on /* or /assets/* 404s.

name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - 'functions/**'
      - 'firestore.rules'
  workflow_dispatch:

concurrency:
  # Never cancel an in-flight Pages upload — partial deploys cause hashed
  # chunk 404s while index.html already references the new build.
  group: pages-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        # package-lock.json is gitignored in this repo — use npm install, not npm ci
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_PAYSTACK_PUBLIC_KEY: ${{ secrets.VITE_PAYSTACK_PUBLIC_KEY }}
          VITE_ENV_MODE: production

      - name: Verify hashed assets exist
        run: |
          set -e
          test -f dist/index.html
          test -f dist/_headers
          test -f dist/_redirects
          test -f dist/version.json
          count=$(find dist/assets -type f -name '*.js' | wc -l)
          echo "JS assets in dist/assets: $count"
          test "$count" -ge 10
          # Entry script referenced by index must exist on disk
          entry=$(grep -oE '/assets/index-[^"]+\.js' dist/index.html | head -1)
          test -n "$entry"
          test -f "dist${entry}"
          echo "Entry OK: $entry"

      # ./functions is Firebase Cloud Functions. Wrangler treats ./functions as
      # Pages Functions and fails — stage a clean dist-only tree first.
      # pages-functions/ holds the asset-404 cache middleware (not Firebase).
      - name: Stage clean dist for Pages
        run: |
          rm -rf .cf-deploy
          mkdir -p .cf-deploy
          cp -R dist .cf-deploy/dist
          cp -R pages-functions .cf-deploy/functions

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Run from .cf-deploy so Wrangler does not scan repo ./functions
          workingDirectory: .cf-deploy
          command: pages deploy dist --project-name=ellines-haven --commit-dirty=true --branch=main

      - name: Smoke-check production assets
        run: |
          set -e
          sleep 8
          entry=$(grep -oE '/assets/index-[^"]+\.js' dist/index.html | head -1)
          code=$(curl -sS -o /dev/null -w '%{http_code}' "https://haven.ellines.co.ke${entry}")
          echo "GET ${entry} → ${code}"
          test "$code" = "200"
          html_cc=$(curl -sSI "https://haven.ellines.co.ke/" | tr -d '\r' | grep -i '^cache-control:' | head -1)
          echo "index Cache-Control: $html_cc"
          echo "$html_cc" | grep -qi 'max-age=0\|must-revalidate\|no-cache'
          miss_cc=$(curl -sSI "https://haven.ellines.co.ke/assets/__eh_missing_chunk__.js" | tr -d '\r' | grep -iE '^(cache-control|cdn-cache-control):' || true)
          echo "missing asset headers:"$'\n'"$miss_cc"
          # Must not advertise year-long / immutable caching on a 404
          if echo "$miss_cc" | grep -qi 'immutable\|max-age=31536000'; then
            echo "::warning::Missing asset still advertises long cache — check zone Cache Rules"
          fi
