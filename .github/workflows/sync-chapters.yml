name: Sync Chapters — Firestore → bookChapters.js

on:
  # Run automatically every hour
  schedule:
    - cron: '0 * * * *'

  # Run on every push to main (catches manual deploys)
  push:
    branches: [main]

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  sync:
    name: Pull chapters from Firestore and commit
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to commit and push

    steps:
      # 1. Checkout repo
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Set up Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install dependencies (firebase is already in package.json)
      - name: Install dependencies
        run: npm ci
        working-directory: .

      # 4. Run the pull sync — reads Firestore, writes bookChapters.js
      - name: Pull chapters from Firestore
        run: node sync-chapters.mjs pull
        env:
          # Firebase config is public (it's already in the source code)
          # No secrets needed — Firestore rules control read access
          NODE_ENV: production

      # 5. Check if bookChapters.js actually changed
      - name: Check for changes
        id: changes
        run: |
          git diff --quiet src/data/bookChapters.js || echo "changed=true" >> $GITHUB_OUTPUT

      # 6. Commit and push only if the file changed
      - name: Commit and push updated bookChapters.js
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/bookChapters.js
          git commit -m "chore: sync chapters from Firestore [skip ci]"
          git push
